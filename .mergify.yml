pull_request_rules:
  - name: VM5 loop add canary
    conditions:
      - title ~= VM5-LOOP-SINK-261008
    actions:
      label:
        add:
          - vm5-loop-freeze-261008

  - name: VM5 loop remove canary
    conditions:
      - title ~= VM5-LOOP-SINK-261008
    actions:
      label:
        remove:
          - vm5-loop-freeze-261008

  - name: VM5 post-loop add canary
    conditions:
      - title ~= VM5-AFTER-SINK-261008
    actions:
      label:
        add:
          - vm5-loop-freeze-261008

  - name: VM5 stale-label sink merge
    conditions:
      - title ~= VM5-AFTER-SINK-261008
      - "-label = vm5-loop-freeze-261008"
    actions:
      merge:
        method: squash
